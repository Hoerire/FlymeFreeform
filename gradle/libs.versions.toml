[versions]
agp = "9.4.1"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
composeBom = "2026.09.00"
kotlin = "2.4.21"
libxposedApi = "102.0.0"
libxposedService = "102.0.0"
glasmio = "0.1.3"
junit = "4.13.2"
dexkit = "2.3.0"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "libxposedApi" }
libxposed-service = { group = "io.github.libxposed", name = "service", version.ref = "libxposedService" }
glasmio-core = { group = "io.github.neoruaa.glasmio", name = "glasmio-core", version.ref = "glasmio" }
glasmio-glass = { group = "io.github.neoruaa.glasmio", name = "glasmio-glass", version.ref = "glasmio" }
glasmio-ui = { group = "io.github.neoruaa.glasmio", name = "glasmio-ui", version.ref = "glasmio" }
glasmio-scaffold = { group = "io.github.neoruaa.glasmio", name = "glasmio-scaffold", version.ref = "glasmio" }
glasmio-preference = { group = "io.github.neoruaa.glasmio", name = "glasmio-preference", version.ref = "glasmio" }
glasmio-icons = { group = "io.github.neoruaa.glasmio", name = "glasmio-icons", version.ref = "glasmio" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
dexkit = { group = "org.luckypray", name = "dexkit", version.ref = "dexkit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
