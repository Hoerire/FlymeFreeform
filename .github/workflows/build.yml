name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# 并发取消当前关闭：每个推送都独立排队构建。
# 开启时同分支只保留最新一次构建，代价是取消接口异常会让后续提交一起排队。
# concurrency:
#   group: build-${{ github.ref }}
#   cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 依赖 + wrapper + Kotlin 编译缓存，命中时构建从 4 分钟降到 1 分钟左右。
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.kotlin
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      # 单元测试是契约门禁：先发现当前 AGP 实际生成的 test*UnitTest 任务再跑，
      # 避免把任务名写死（AGP 9 下 testReleaseUnitTest 不一定存在）。
      # 此步只报不挡（continue-on-error）：契约变更期的既有失败不应挡住出包，
      # 但每次都会把失败清单打出来，便于按清单修复。
      - name: Unit tests
        continue-on-error: true
        run: |
          chmod +x gradlew
          TASK=$(./gradlew -q :app:tasks --all | grep -oE "test[A-Za-z]+UnitTest" | head -1 || true)
          echo "unit-test task: ${TASK:-none}"
          if [ -n "$TASK" ]; then ./gradlew ":app:${TASK}" --stacktrace; else echo "NO_UNIT_TEST_TASK"; fi

      # libs/ 下两个 AAR 产物不入库（体积大且随版本变化），构建前现取：
      # 见 docs/build-deps.md。缺这两个文件时 :app:assembleRelease 会编译失败。
      - name: Prepare compile-only stubs
        run: |
          mkdir -p libs
          curl -sL -o /tmp/preference.aar \
            https://dl.google.com/android/maven2/androidx/preference/preference/1.2.1/preference-1.2.1.aar
          unzip -p /tmp/preference.aar classes.jar > libs/preference-classes.jar
          curl -sL -o /tmp/fragment.aar \
            https://dl.google.com/android/maven2/androidx/fragment/fragment/1.8.9/fragment-1.8.9.aar
          unzip -p /tmp/fragment.aar classes.jar > libs/fragment-classes.jar
          ls -l libs

      - name: Assemble release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --stacktrace

      - name: Show output
        run: ls -l app/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Free-apk
          path: app/build/outputs/apk/release/*.apk
